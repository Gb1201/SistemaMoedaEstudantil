<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Coin base -->
  <circle cx="32" cy="32" r="30" fill="#facc15"/>
  <!-- Coin rim -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <!-- ◈ symbol -->
  <text x="32" y="40" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#1e3a5f">◈</text>
</svg>